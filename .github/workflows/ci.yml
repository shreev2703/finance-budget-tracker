name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # A throwaway Postgres for the backend tests. Never the team's Supabase project.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Backend tests on a real Postgres server
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://ledger:ledger@localhost:5432/ledger_test
      - name: Backend tests on PGlite (what a laptop with no setup runs)
        run: npm test
      - run: npm run build -w frontend
